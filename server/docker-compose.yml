# =============================================================================
# SilentCamTrap - Docker Compose Configuration
# =============================================================================
# Run with: docker-compose up -d
# =============================================================================

version: '3.8'

services:
  silentcamtrap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: silentcamtrap-server
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production-please}
      - API_KEY=${API_KEY:-your-secure-api-key}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - ENABLE_AUTH=true
      - ENABLE_RATE_LIMIT=true
      - MAX_FILE_SIZE_MB=10
    volumes:
      # Persistent data storage
      - silentcamtrap_uploads:/app/data/uploads
      - silentcamtrap_logs:/app/data/logs
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - silentcamtrap_network

# Named volumes for data persistence
volumes:
  silentcamtrap_uploads:
    driver: local
  silentcamtrap_logs:
    driver: local

# Network configuration
networks:
  silentcamtrap_network:
    driver: bridge
